name: shared_core
description: "小学コレシリーズ共通パッケージ — models / providers / widgets / services / theme"
version: 0.1.0

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.4.2
  uuid: ^4.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cross_promo_kit:
    path: ../cross_promo_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - lib/assets/badge_icons/
    - lib/assets/avatars/
    - lib/assets/ui_elements/
    - lib/assets/shop/
