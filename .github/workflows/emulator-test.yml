name: Emulator Tests

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze --fatal-infos lib/

      - name: Build APK
        run: flutter build apk --release --no-shrink 2>&1 | tail -20
        continue-on-error: true

      - name: Verify build
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk 2>/dev/null && echo "✅ APK built" || echo "⚠️ Build skipped"
