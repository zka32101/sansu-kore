name: Flutter CI

on:
  push:
    branches: [ master, main, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      run_signed_build:
        description: '署名付きiOSビルド(build-ios-signed)も実行する（Secrets未設定の間はfalseのまま）'
        type: boolean
        default: false

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze || true

  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Clean build cache
      run: flutter clean && flutter pub get

    - name: Create google-services.json from Secret
      env:
        GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES" ]; then
          echo "$GOOGLE_SERVICES" > android/app/google-services.json
        fi

    - name: Build APK
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: flutter build appbundle --release

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sansu-kore-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

    - name: Upload AAB to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sansu-kore-aab
        path: build/app/outputs/bundle/release/app-release.aab
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-google-drive:
    name: Upload to Google Drive
    uses: ./.github/workflows/google-drive-upload.yml
    needs: build-android
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    secrets: inherit

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    needs: test
    # macOSランナーはLinuxの10倍のActions分数を消費するため、通常のpushでは実行しない。
    # PR時、または手動実行（Actionsタブ → Run workflow）でのみ起動する。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Create google-services.json from Secret
      env:
        GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES" ]; then
          echo "$GOOGLE_SERVICES" > android/app/google-services.json
        fi

    # Update CocoaPods repositories to resolve Swift Package Manager dependencies
    - name: Update CocoaPods repositories
      run: pod repo update

    # GoogleService-Info.plist未登録のため現時点ではFirebase iOS機能は動作しないが、
    # コード署名なしのコンパイル検証（Podfile/Xcodeプロジェクト設定の妥当性確認）は可能。
    # Disable Swift Package Manager to avoid conflicts with CocoaPods (google_mobile_ads)
    - name: Build iOS (no codesign)
      env:
        FLUTTER_DISABLE_SWIFT_PACKAGE_MANAGER: "true"
      run: flutter build ios --release --no-codesign

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: sansu-kore-ios-unsigned
        path: build/ios/iphoneos/Runner.app
        retention-days: 30

  build-ios-signed:
    name: Build & Upload Signed iOS (TestFlight)
    runs-on: macos-latest
    needs: test
    # 最もコストの高いジョブ。署名証明書・プロビジョニングプロファイル・
    # App Store Connect APIキーがGitHub Secretsに登録されるまでは失敗する（想定内）。
    # Apple Developer Program登録・ios/ExportOptions.plist作成後に有効化する。
    # run_signed_build を明示的に true にした手動実行時のみ起動（誤って毎回起動しないよう分離）。
    if: github.event_name == 'workflow_dispatch' && inputs.run_signed_build == true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Create google-services.json from Secret
      env:
        GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES" ]; then
          echo "$GOOGLE_SERVICES" > android/app/google-services.json
        fi

    - name: Import signing certificate
      env:
        P12_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: temporary-ci-keychain-password
      run: |
        echo "$P12_BASE64" | base64 --decode > certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security list-keychains -d user -s build.keychain login.keychain
        rm certificate.p12

    - name: Install provisioning profile
      env:
        PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      run: |
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

    - name: Install App Store Connect API key
      env:
        API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

    # Update CocoaPods repositories to resolve Swift Package Manager dependencies
    - name: Update CocoaPods repositories
      run: pod repo update

    - name: Build signed IPA
      env:
        FLUTTER_DISABLE_SWIFT_PACKAGE_MANAGER: "true"
      run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

    - name: Upload to App Store Connect (TestFlight)
      env:
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
          --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
