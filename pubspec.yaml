name: sansu_kore
description: "小学コレ！算数 - 小学1～6年生が算数をゲーム感覚で学べる学習アプリ"
publish_to: 'none'

version: 3.2.1+20

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  shared_core:
    path: packages/shared_core
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit.git
      ref: main
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  confetti: ^0.8.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  firebase_messaging: ^15.1.6
  cloud_firestore: ^5.4.2
  in_app_purchase: ^3.3.0
  purchases_flutter: ^10.11.0
  google_fonts: ^6.2.1
  uuid: ^4.0.0
  # google_mobile_ads: ^5.2.0  # TODO: Re-enable once SPM/CocoaPods conflict is resolved
  share_plus: ^11.0.0
  flutter_tts: ^4.2.5
  # Note: google_mobile_ads dependency disabled (2026-09-09)
  # Reason: iOS SPM/CocoaPods conflict with webview_flutter_wkwebview
  # Will be re-enabled once dependency ecosystem resolves the conflict
  # ads_provider.dart uses stub implementation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/app_icon/
    - assets/avatars/
    - assets/legal/
    - assets/characters/tier1/
    - assets/characters/tier2/
    - assets/characters/tier3/
    - assets/characters/tier4/
